name: Deploy landing + SPA demo to GitHub Pages

# Builds the static landing page (14 locales) plus the Leptos SPA demo
# bundle and publishes the resulting `dist/` to GitHub Pages. The deploy
# is purely static — no runtime secrets are baked in. The Cloudflare
# worker (which holds API keys) deploys separately via `wrangler` and is
# not in scope for this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Single concurrent deploy; cancel in-progress runs on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

# Permissions required by the Pages action.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc for the
    # author's local machine; RUSTUP_TOOLCHAIN overrides it on Linux CI.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/spa/dist
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailwind + Trunk
        run: |
          npm install --no-save tailwindcss@3
          TRUNK_VERSION=v0.21.14
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          trunk --version

      - name: Build demo SPA bundle
        working-directory: crates/spa
        run: |
          mkdir -p dist
          npx tailwindcss -i ./input.css -o ./dist/styles.css --minify
          trunk build --release --public-url /demo/

      - name: Build landing (14 locales) + copy demo SPA into /demo
        env:
          # Served from the custom domain apex (landing/CNAME binds it).
          CANONICAL_BASE: https://grumps.app
          # Empty — site lives at root on the custom domain.
          SITE_PATH: ""
        run: node landing/build.mjs

      - name: Build real SPA bundle (served at root for /w/:slug routes)
        working-directory: crates/spa
        run: |
          # Rebuild with --public-url / so asset URLs are absolute from root.
          # Overwrites crates/spa/dist/ but the demo bundle has already been
          # copied into dist/demo/ by the landing build above.
          rm -rf dist
          mkdir -p dist
          npx tailwindcss -i ./input.css -o ./dist/styles.css --minify
          trunk build --release --public-url /

      - name: Install real SPA at dist root with 404 fallback
        run: |
          # GH Pages serves dist/404.html for any unmatched path. Using the
          # SPA shell as 404.html means /w/:slug, /login, /dashboard, etc.
          # load the SPA; Leptos client-side routing picks the route.
          # Landing's dist/index.html at root remains untouched.
          mv crates/spa/dist/index.html dist/404.html
          cp -r crates/spa/dist/. dist/

      - name: Ensure demo SPA has its own 404 fallback
        run: |
          if [ -f dist/demo/index.html ]; then
            cp dist/demo/index.html dist/demo/404.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
