name: CI

# Verify on every PR and on main: workspace tests, clippy, rustfmt, i18n
# parity, and the full e2e suite. On push to main (or a manual dispatch),
# once all of those pass, this same workflow also deploys: `deploy-worker`
# publishes the Cloudflare worker + runs DB migrations, and `pages-build` /
# `pages-deploy` publish the landing+SPA bundle to GitHub Pages. There is no
# separate deploy-pages.yml — it all lives here so the deploy jobs can `needs`
# the verification jobs directly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; new pushes cancel in-flight runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The worker + spa target wasm32-unknown-unknown; the rest are native.
      # We surface warnings on every workspace member for the native target,
      # then re-run for wasm32 to catch wasm-only lints. `-D warnings` is
      # NOT yet enabled because there is a pre-existing dead-code backlog
      # tracked in docs/superpowers/2026-04-26-audit-followups.md; flip
      # this to `-- -D warnings` once that cleanup lands so regressions
      # become hard failures.
      # `.cargo/config.toml` pins the default target to wasm32; the native
      # checks must override it to the Linux host triple, otherwise dev-deps
      # like rusqlite (bundled C SQLite) try to compile to wasm and fail.
      - name: clippy (native workspace)
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu
      - name: clippy (wasm32 worker + spa)
        run: |
          cargo clippy -p grumps-worker --target wasm32-unknown-unknown
          cargo clippy -p grumps-spa    --target wasm32-unknown-unknown

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # `--lib`/`--tests` cover unit + non-ignored integration tests under
      # `crates/worker/tests/`; the live-`wrangler` ones are `#[ignore]`d.
      # Native host triple overrides the wasm32 default in `.cargo/config.toml`
      # (tests can't run on wasm32-unknown-unknown). `--doc` cannot be combined
      # with `--lib`/`--tests` in one invocation, so doctests run separately.
      - name: cargo test (workspace lib + integration tests)
        run: cargo test --workspace --lib --tests --target x86_64-unknown-linux-gnu
      - name: cargo doctests
        run: cargo test --workspace --doc --target x86_64-unknown-linux-gnu

  i18n-validate:
    name: i18n locale parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Every locale JSON must (a) parse as JSON and (b) contain every
      # key that `en.json` defines. Missing keys fall back at runtime
      # but we want the gap surfaced at PR time.
      - name: Validate locale files
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'crates/i18n/locales';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          const en = JSON.parse(fs.readFileSync(path.join(dir, 'en.json')));
          const enKeys = new Set(Object.keys(en));
          let bad = 0;
          for (const f of files) {
            let parsed;
            try { parsed = JSON.parse(fs.readFileSync(path.join(dir, f))); }
            catch (e) { console.error('FAIL parse', f, e.message); bad++; continue; }
            if (f === 'en.json') continue;
            const missing = [...enKeys].filter(k => !(k in parsed));
            if (missing.length) {
              console.error('MISSING keys in', f, '(showing up to 10):', missing.slice(0, 10));
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log('All', files.length, 'locale files OK');
          "

  # Full Playwright suite (all 24 specs) against a locally-built wasm worker.
  # This is the guard that would have caught the jsonwebtoken crypto-provider
  # panic: the worker is compiled to wasm and actually serves
  # `POST /auth/telegram/verify` (dev-bypass), exercising JWT signing — the
  # exact path that crashed in prod.
  #
  # INDEX_DB-scoped surfaces (auth, sessions, dashboard) use a real D1
  # binding, so wrangler dev backs them with a local SQLite file we migrate +
  # seed hermetically. Per-workspace surfaces (todos, notes, members, memory,
  # scheduled, …) go through the D1 HTTP API, hardcoded to
  # api.cloudflare.com in production but overridden here via `D1_REST_BASE`
  # to `scripts/d1-shim` — a better-sqlite3-backed stand-in for that same
  # request/response contract — so they run hermetically too, no live
  # Cloudflare account involved. See `crates/worker/src/d1_rest.rs` and
  # issue #9 for the fuller design this is a pragmatic slice of.
  #
  # In `deploy-worker`'s and `pages-build`'s `needs`: a red run here blocks
  # both deploys.
  e2e:
    name: e2e (full suite)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # worker-build is a `cargo install`, not a workspace dependency, so
      # rust-cache above doesn't cover it — cache the installed binary
      # directly so an unchanged pin skips the from-source rebuild.
      - name: Cache ~/.cargo/bin (worker-build)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-worker-build-0.8.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Trunk + Tailwind
        run: |
          npm install --no-save tailwindcss@4.3.0 @tailwindcss/cli@4.3.0
          TRUNK_VERSION=v0.21.14
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          trunk --version

      - name: Install Playwright (chromium)
        working-directory: tests
        # `npm install` (not `npm ci`): tests/package-lock.json is gitignored,
        # so there's no lockfile in the repo for `npm ci` to consume.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # better-sqlite3's prebuilt binary covers linux-x64 — no native
      # toolchain needed on this runner. The shim's own package.json already
      # pins the dependency.
      - name: Install D1 shim deps
        working-directory: scripts/d1-shim
        run: npm install --no-audit --no-fund

      # Local-only dummy secrets. These are NOT real credentials.
      #   JWT_SECRET / GRUMPS_DEV_AUTH_BYPASS: dev-bypass login.
      #   TG_WEBHOOK_SECRET: must match the fixed placeholder every webhook
      #     spec sends as `X-Telegram-Bot-Api-Secret-Token` — same fake
      #     value across `tests/e2e/{webhook-telegram,webhook-todo,billing,
      #     history}.spec.ts`, never a real bot secret.
      #   SUPER_ADMIN_TELEGRAM_IDS: the dev-bypass user's tg id, seeded below
      #     — lets `scheduled.spec.ts`'s force-fire test run instead of
      #     self-skipping.
      #   CF_ACCOUNT_ID / CF_API_TOKEN: `D1RestClient::from_env` requires both
      #     secrets before it can issue any per-workspace query, even against
      #     the shim (which ignores auth and matches any account id in the
      #     URL). Without them every shim-backed route 500s.
      - name: Write local .dev.vars
        run: |
          cat > .dev.vars <<'EOF'
          ENVIRONMENT=development
          JWT_SECRET=ci-test-jwt-secret-not-a-real-key
          GRUMPS_DEV_AUTH_BYPASS=1
          TG_BOT_TOKEN=ci-test-bot-token
          TG_WEBHOOK_SECRET=f36638579db4005af0e80f584ae9d4492472f953f3c74b6361d106827738a9db
          SUPER_ADMIN_TELEGRAM_IDS=6108569905
          CF_ACCOUNT_ID=ci-local-account
          CF_API_TOKEN=ci-test-token-not-real
          EOF

      - name: Migrate + seed local INDEX_DB (SQLite)
        run: |
          npx wrangler d1 migrations apply grumps-index --local
          npx wrangler d1 execute grumps-index --local --file=scripts/seed-e2e-index.sql

      # Build the two wasm bundles in separate steps, not concurrently: two
      # release wasm compiles at once can OOM the runner. Building here also
      # turns a compile error into a clear step failure instead of a silent
      # "server never came up".
      - name: Build worker (wasm)
        run: |
          cargo install -q --locked worker-build@0.8.3
          ( cd crates/worker && worker-build --release )
      - name: Build SPA (wasm)
        working-directory: crates/spa
        run: |
          npx @tailwindcss/cli -i ./input.css -o ./tailwind.out.css --minify
          trunk build --release

      # Start the D1 shim first — the per-workspace migrate+seed step below,
      # and every per-workspace request the worker makes once it's up, both
      # depend on it already listening.
      - name: Start D1 shim
        run: |
          node scripts/d1-shim/server.mjs > /tmp/d1-shim.log 2>&1 &
          echo "Waiting for D1 shim on :8788 …"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/_shim/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "=== d1-shim.log ==="; cat /tmp/d1-shim.log || true; exit 1

      - name: Migrate + seed the shim's per-workspace databases
        run: node scripts/e2e-setup.mjs

      # Start the already-built worker + SPA, wait for readiness, then run the
      # specs. Backgrounded servers must share this step (a step boundary reaps
      # them); their output is captured so a startup failure is visible. If the
      # worker exits early we print its log and fail fast instead of looping.
      - name: Run full e2e suite
        run: |
          set -e
          # --local forces fully-local mode. Without it wrangler opens a remote
          # proxy session for the AI/Vectorize bindings (no local simulator),
          # which needs Cloudflare auth and fails in CI. D1_REST_BASE points
          # every per-workspace D1 REST call at the shim instead of
          # api.cloudflare.com (see `crates/worker/src/d1_rest.rs`).
          npx wrangler dev --local --port 8787 \
            --var ENVIRONMENT:development \
            --var D1_REST_BASE:http://127.0.0.1:8788 \
            > /tmp/wrangler.log 2>&1 &
          WORKER_PID=$!
          ( cd crates/spa && trunk serve --release --port 8080 > /tmp/trunk.log 2>&1 ) &
          echo "Waiting for worker on :8787 …"
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then echo "wrangler dev exited early"; break; fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then echo "=== wrangler.log ==="; cat /tmp/wrangler.log || true; exit 1; fi
          echo "Worker ready. Waiting for SPA on :8080 …"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break; sleep 5; done
          cd tests && npx playwright test

      # Spec failures usually surface as opaque non-OK API responses; the
      # worker/shim logs carry the actual server-side error. dmesg + ps cover
      # the "worker process died mid-run" class (OOM kill, workerd abort).
      - name: Dump worker + shim logs on failure
        if: failure()
        run: |
          echo "=== wrangler.log (tail) ==="; tail -n 3000 /tmp/wrangler.log || true
          echo "=== d1-shim.log (tail) ==="; tail -n 100 /tmp/d1-shim.log || true
          echo "=== surviving processes ==="; ps aux | grep -E "wrangler|workerd|trunk|d1-shim" | grep -v grep || true
          echo "=== dmesg (tail) ==="; sudo dmesg | tail -n 40 || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

  # Deploy the Cloudflare worker + run DB migrations. Runs on push to main
  # (after fmt/clippy/test/e2e pass, so a red build never deploys) and on a
  # manual `workflow_dispatch` run targeting main — useful for re-deploys and
  # for validating the pipeline on demand. The static landing+SPA bundle is
  # built and published by the `pages-build`/`pages-deploy` jobs below, gated
  # on the same jobs.
  deploy-worker:
    name: deploy worker
    needs: [rustfmt, clippy, test, i18n-validate, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `wrangler deploy` below shells out to `cargo install -q --locked
      # worker-build@0.8.3` via wrangler.toml's [build] command — cache the
      # installed binary so an unchanged pin skips the from-source rebuild
      # (previously ran uncached on every deploy).
      - name: Cache ~/.cargo/bin (worker-build)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-worker-build-0.8.3

      # `wrangler deploy` runs the [build] command in wrangler.toml
      # (cargo install worker-build && worker-build --release), satisfied by
      # the rust+wasm32 toolchain above. Runtime secrets (JWT_SECRET, etc.)
      # are set out-of-band via `wrangler secret put` and are NOT touched here.
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # Index DB (single, fixed binding) — wrangler-native, idempotent; only
      # applies migration files not yet recorded in its d1_migrations table.
      - name: Apply index DB migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: d1 migrations apply grumps-index --remote

      # Workspace DBs are dynamic (one per group) and can only be migrated by
      # the worker's own runtime runner. Trigger it post-deploy via the
      # secret-gated internal endpoint. -f makes a non-2xx response fail the
      # job. The endpoint processes one bounded chunk of workspaces per call
      # (to stay under the Workers subrequest cap on a large fleet) and
      # returns {done, next_offset} — loop until done:true. The 200-iteration
      # cap (6000 workspaces at 30/chunk) is a safety net against an infinite
      # loop if the endpoint ever stops advancing; it should never be hit.
      - name: Migrate workspace DBs
        env:
          MIGRATE_SECRET: ${{ secrets.MIGRATE_SECRET }}
        run: |
          offset=0
          for i in $(seq 1 200); do
            response=$(curl -fsS -X POST "https://api.grumps.app/internal/migrate-workspaces?offset=${offset}" \
              -H "X-Migrate-Secret: ${MIGRATE_SECRET}")
            echo "$response"
            done_flag=$(echo "$response" | jq -r '.done')
            offset=$(echo "$response" | jq -r '.next_offset')
            if [ "$done_flag" = "true" ]; then
              exit 0
            fi
          done
          echo "::error::migrate-workspaces did not report done:true within 200 chunks"
          exit 1

  # Build the static landing page (14 locales) + Leptos SPA demo bundle and
  # publish to GitHub Pages. Gated on the same jobs as deploy-worker (now
  # including the full e2e suite), so a red build never publishes (previously
  # this ran on every push, ungated). The deploy is purely static — no
  # runtime secrets are baked in.
  pages-build:
    name: build pages
    needs: [rustfmt, clippy, test, i18n-validate, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc for the author's
    # local machine; RUSTUP_TOOLCHAIN overrides it on Linux CI.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/spa/dist
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailwind + Trunk
        run: |
          npm install --no-save tailwindcss@4.3.0 @tailwindcss/cli@4.3.0
          TRUNK_VERSION=v0.21.14
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          trunk --version

      - name: Build demo SPA bundle
        working-directory: crates/spa
        run: |
          mkdir -p dist
          npx @tailwindcss/cli -i ./input.css -o ./dist/styles.css --minify
          trunk build --release --public-url /demo/

      - name: Build landing (14 locales) + copy demo SPA into /demo
        env:
          # Served from the custom domain apex (landing/CNAME binds it).
          CANONICAL_BASE: https://grumps.app
          # Empty — site lives at root on the custom domain.
          SITE_PATH: ""
        run: node landing/build.mjs

      - name: Build real SPA bundle (served at root for /w/:slug routes)
        working-directory: crates/spa
        run: |
          # Rebuild with --public-url / so asset URLs are absolute from root.
          # Overwrites crates/spa/dist/ but the demo bundle has already been
          # copied into dist/demo/ by the landing build above.
          rm -rf dist
          mkdir -p dist
          npx @tailwindcss/cli -i ./input.css -o ./dist/styles.css --minify
          trunk build --release --public-url /

      - name: Install real SPA at dist root with 404 fallback
        run: |
          # GH Pages serves dist/404.html for any unmatched path. Using the
          # SPA shell as 404.html means /w/:slug, /login, /dashboard, etc.
          # load the SPA; Leptos client-side routing picks the route.
          # Landing's dist/index.html at root remains untouched.
          mv crates/spa/dist/index.html dist/404.html
          cp -r crates/spa/dist/. dist/

      - name: Ensure demo SPA has its own 404 fallback
        run: |
          if [ -f dist/demo/index.html ]; then
            cp dist/demo/index.html dist/demo/404.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    name: deploy pages
    needs: [pages-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Pages deploy needs elevated permissions the rest of CI does not.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize Pages deploys independently of the rest of the CI run.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
