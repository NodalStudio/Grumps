[package]
name = "grumps-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
grumps-core = { path = "../core" }
grumps-agent = { path = "../agent" }
grumps-nlu = { path = "../nlu" }
grumps-messaging = { path = "../messaging" }
grumps-memory = { path = "../memory" }
grumps-calendar = { path = "../calendar" }
grumps-scheduler = { path = "../scheduler" }
grumps-i18n = { path = "../i18n" }
worker = { version = "0.8", features = ["d1"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
thiserror.workspace = true
jsonwebtoken = { version = "9", default-features = false }
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }

[lib]
crate-type = ["cdylib"]
