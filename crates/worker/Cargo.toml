[package]
name = "grumps-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
grumps-core = { path = "../core", features = ["validation"] }
grumps-agent = { path = "../agent" }
grumps-nlu = { path = "../nlu" }
grumps-messaging = { path = "../messaging" }
grumps-memory = { path = "../memory" }
grumps-calendar = { path = "../calendar" }
grumps-scheduler = { path = "../scheduler" }
grumps-i18n = { path = "../i18n" }
worker = { version = "0.8.3", features = ["d1"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
thiserror.workspace = true
# jsonwebtoken 10 requires picking exactly one CryptoProvider feature; the
# default `aws_lc_rs` does not run on wasm32, so select the pure-Rust
# `rust_crypto` backend. Omitting both makes `encode`/`decode` panic at runtime.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
async-trait = "0.1"
validator = { workspace = true }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
console_error_panic_hook = "0.1"

# jsonwebtoken 10 pulls getrandom 0.2 transitively; on wasm it needs the `js`
# feature to compile (the CF Workers target is wasm32-unknown-unknown). The
# host test build never reaches this entry.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["blocking", "json"] }
# D1 is SQLite — exercise the migration schema + the tz/civil-date queries
# against a real in-memory SQLite, no live D1 needed.
rusqlite = { version = "0.40", features = ["bundled"] }

[lib]
crate-type = ["cdylib"]
