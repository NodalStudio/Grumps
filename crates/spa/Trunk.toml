[build]
target = "index.html"
dist = "dist"

# Local-dev proxy: forward worker traffic through trunk's dev server so
# SPA + API share the same origin (localhost:8080). Required for cookies
# (especially the non-HttpOnly grumps_csrf) to be readable from the SPA.
[[proxy]]
backend = "http://127.0.0.1:8787/auth/"

[[proxy]]
backend = "http://127.0.0.1:8787/api/"

[[proxy]]
backend = "http://127.0.0.1:8787/health"

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "npx @tailwindcss/cli -i ./input.css -o ./tailwind.out.css --minify 2>/dev/null || npx @tailwindcss/cli -i ./input.css -o ./tailwind.out.css"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "OUT=\"${TRUNK_STAGING_DIR:-dist}\"; cp manifest.json sw.js favicon.svg _routes.json \"$OUT/\" 2>/dev/null || true; HASH=$(git rev-parse --short=12 HEAD 2>/dev/null || date +%s); if [ -f \"$OUT/sw.js\" ]; then sed -i.bak \"s/__BUILD_HASH__/$HASH/g\" \"$OUT/sw.js\" && rm -f \"$OUT/sw.js.bak\"; fi"]
