[package]
name = "grumps-spa"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
log = "0.4"
wasm-logger = "0.2"
