name = "grumps-api"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2024-12-01"

# Custom domain — requires the zone to be attached to this Cloudflare account.
routes = [
  { pattern = "api.grumps.app", zone_name = "grumps.app", custom_domain = true },
]

[build]
command = "cargo install -q worker-build && cd crates/worker && worker-build --release"

# Public env vars exposed to the worker at runtime via `ctx.env.var(...)`.
# These are NOT secrets — committed to wrangler.toml at deploy time.
[vars]
ENVIRONMENT = "production"
WA_PHONE_NUMBER_ID = "1007990222407676"
WEB_SEARCH_PROVIDER = "brave"
TG_BOT_USERNAME = "HeyGrumpsBot"

# Declare which secrets are required at deploy time. Loaded from `.dev.vars`
# / `.env` for `wrangler dev`; set via `wrangler secret put` for production.
[secrets]
required = [
  "JWT_SECRET",
  "TG_BOT_TOKEN",
  "TG_WEBHOOK_SECRET",
  "ANTHROPIC_API_KEY",
  "GEMINI_API_KEY",
  "WA_APP_SECRET",
  "WA_ACCESS_TOKEN",
  "CF_API_TOKEN",
  "CF_ACCOUNT_ID",
  "BRAVE_API_KEY",
  "SUPER_ADMIN_PHONES",
]

[[d1_databases]]
binding = "INDEX_DB"
database_name = "grumps-index"
database_id = "332f7bf9-c782-43ed-a13e-4664eacf3f38"

[[kv_namespaces]]
binding = "KV"
id = "877b7876c7c54c97b47eeb7f0e2a00e6"

[triggers]
crons = []

[ai]
binding = "AI"

[[vectorize]]
binding = "CHAT_RAG"
index_name = "grumps-chat-rag"

[[durable_objects.bindings]]
name = "WS_SCHEDULER"
class_name = "WorkspaceScheduler"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkspaceScheduler"]
