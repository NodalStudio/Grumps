name = "grumps-api"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2024-12-01"

# Custom domain — requires the zone to be attached to this Cloudflare account.
routes = [
  { pattern = "api.grumps.app", zone_name = "grumps.app", custom_domain = true },
]

[build]
# worker-build is pinned to match the `worker` 0.8.1 crate / wasm-bindgen
# 0.2.118 (hard-pinned transitively via js-sys 0.3.95). The unversioned
# `cargo install` grabs latest (0.8.3+), which demands wasm-bindgen >= 0.2.121
# and fails the build. Bump this in lockstep when upgrading the worker crate.
command = "cargo install -q --locked worker-build@0.8.1 && cd crates/worker && worker-build --release"

# Public env vars exposed to the worker at runtime via `ctx.env.var(...)`.
# These are NOT secrets — committed to wrangler.toml at deploy time.
[vars]
ENVIRONMENT = "production"
WA_PHONE_NUMBER_ID = "1007990222407676"
WEB_SEARCH_PROVIDER = "brave"
TG_BOT_USERNAME = "HeyGrumpsBot"

# Required secrets (set via `wrangler secret put` in prod, .dev.vars locally):
#   JWT_SECRET, TG_BOT_TOKEN, TG_WEBHOOK_SECRET, ANTHROPIC_API_KEY,
#   GEMINI_API_KEY, WA_APP_SECRET, WA_ACCESS_TOKEN, CF_API_TOKEN,
#   CF_ACCOUNT_ID, BRAVE_API_KEY (optional),
#   MIGRATE_SECRET (shared secret CI presents to POST /internal/migrate-workspaces;
#     mirror the same value into the GitHub `MIGRATE_SECRET` repo secret),
#   SUPER_ADMIN_TELEGRAM_IDS (optional, comma-separated Telegram numeric ids
#     — the Widget login does not expose phone numbers, so super-admin is
#     identified by Telegram user id),
#   SUPER_ADMIN_PHONES (optional, legacy WA OTP path only).
#
# Not declared via `[secrets] required = [...]` for now because that block
# fail-stops `wrangler deploy` on any missing secret, including BRAVE_API_KEY
# / SUPER_ADMIN_* which aren't always set.

[[d1_databases]]
binding = "INDEX_DB"
database_name = "grumps-index"
database_id = "332f7bf9-c782-43ed-a13e-4664eacf3f38"
# Index-DB schema is applied by `wrangler d1 migrations apply grumps-index`
# in CI (deploy-pages/ci `deploy-worker` job). Only forward `.sql` files live
# in this dir — rollback scripts are kept out of it (scripts/sql/).
migrations_dir = "migrations/index"

[[kv_namespaces]]
binding = "KV"
id = "877b7876c7c54c97b47eeb7f0e2a00e6"

[triggers]
crons = []

[ai]
binding = "AI"

[[vectorize]]
binding = "CHAT_RAG"
index_name = "grumps-chat-rag"

[[durable_objects.bindings]]
name = "WS_SCHEDULER"
class_name = "WorkspaceScheduler"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkspaceScheduler"]
