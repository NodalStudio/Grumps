name = "grumps-api"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "cargo install -q worker-build && cd crates/worker && worker-build --release"

[vars]
ENVIRONMENT = "development"
WA_PHONE_NUMBER_ID = "1007990222407676"
WEB_SEARCH_PROVIDER = "brave"
# All other secrets and per-deployment config (SUPER_ADMIN_PHONES,
# WA_VERIFY_TOKEN, ANTHROPIC_API_KEY, GEMINI_API_KEY, JWT_SECRET,
# CF_API_TOKEN, CF_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, DISCORD_BOT_TOKEN,
# STRIPE_SECRET, BRAVE_API_KEY, etc.) are set via `wrangler secret put`
# — they MUST never live in this file because the repo is public.
# See DEPLOY.md for the full list and `wrangler secret put` invocations.

[[d1_databases]]
binding = "INDEX_DB"
database_name = "grumps-index"
database_id = "332f7bf9-c782-43ed-a13e-4664eacf3f38"

[[kv_namespaces]]
binding = "KV"
id = "877b7876c7c54c97b47eeb7f0e2a00e6"

[triggers]
crons = []

[ai]
binding = "AI"

[[vectorize]]
binding = "CHAT_RAG"
index_name = "grumps-chat-rag"

[[durable_objects.bindings]]
name = "WS_SCHEDULER"
class_name = "WorkspaceScheduler"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkspaceScheduler"]
