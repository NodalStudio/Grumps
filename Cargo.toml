[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/nlu",
    "crates/messaging",
    "crates/worker",
    "crates/spa",
    "crates/memory",
    "crates/scheduler",
    "crates/calendar",
    "crates/agent",
    "crates/i18n",
]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.44", features = ["serde", "wasmbind"] }
chrono-tz = "0.10.4"
uuid = { version = "1.23", features = ["v4", "js", "serde"] }
thiserror = "2.0.18"
validator = { version = "0.18", default-features = false }
