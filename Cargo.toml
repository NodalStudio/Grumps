[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/nlu",
    "crates/messaging",
    "crates/worker",
    "crates/spa",
    "crates/memory",
    "crates/scheduler",
    "crates/calendar",
    "crates/agent",
    "crates/i18n",
    "crates/mcp-types",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "js", "serde"] }
thiserror = "2"
schemars = "1"
